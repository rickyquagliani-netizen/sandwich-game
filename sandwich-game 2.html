async function give(it,w,p){const W=G[w],S=w=='you'?'You':'AI';W.money-=p;(it.cat=='ing'?W.items:W.x).push(it);msg(p?`${W.n} wins ${it.n} for $${p}`:`${W.n} gets ${it.n}`);$('#pYou').classList.remove('on');$('#pAI').classList.remove('on');
$('#card').style.cssText=`transition:transform .6s ease-in,opacity .6s;transform:translateY(${w=='ai'?-280:280}px) scale(.3);opacity:0`;await sleep(620);
if(it.cat=='ing')lay($('#p'+S+' .ls'),it.id,W.items.length-1);else putSlot($('#p'+S+' .swh'),it);render();await sleep(650)}
// ---------- AI ----------
const gain=(P,it)=>score([...all(P),it]).s-score(all(P)).s;
function aiMax(it){const A=G.ai,need=Math.max(1,CAP-all(A).length),me=gain(A,it),th=gain(G.you,it);
if(me<=0||(th<=-3&&me<6))return 0;
const w=me+Math.max(th,0)*.3,s=Math.min(1,w/12);
return Math.max(0,Math.min(A.money,Math.round(A.money/need*(.25+s*1.8)+Math.random()*2-.5)))}
async function aiAct(price,it){await sleep(900+Math.random()*1500);const A=G.ai,mx=aiMax(it);
if(all(A).length==CAP-1)return A.money>price&&mx>price?{t:'b',a:A.money}:{t:'l'};
if(mx>price){const a=Math.min(price+(Math.random()<.7?1:Math.min(3,mx-price)),mx,A.money);return{t:'b',a}}
return price==0?{t:'b',a:1}:{t:'l'}}
// ---------- game ----------
let mode='classic',CAP=5;
const Q={ing:5,drink:1,dessert:1,side:1},cnt=(P,c)=>c=='ing'?P.items.length:P.x.filter(x=>x.cat==c).length,all=P=>[...P.items,...P.x],full=(P,c)=>cnt(P,c)>=Q[c];
async function play(nick){CAP=mode=='complete'?8:5;G={you:{n:nick,money:20,items:[],x:[]},ai:{n:'Chef AI',money:20,items:[],x:[]}};
$('#nYou').textContent=nick.toUpperCase();show('game');$('#pYou .swh').innerHTML=base();$('#pAI .swh').innerHTML=base();document.querySelectorAll('#game .swh').forEach(e=>e.classList.toggle('pl',mode=='complete'));render();
const nd=2+(Math.random()<.5|0),rounds=shuf([...shuf(ALL.filter(x=>x.m)).slice(0,4),...shuf(ALL.filter(x=>x.d)).slice(0,nd),...shuf(ALL.filter(x=>!x.m&&!x.d)).slice(0,6-nd)]);
if(mode=='complete')['drink','dessert','side'].forEach(c=>rounds.push(...shuf(XA.filter(x=>x.cat==c)).slice(0,2)));
let k=0,bonus=0;
for(const it of rounds){const Y=G.you,A=G.ai;
if(it.cat!='ing'&&!bonus){bonus=1;Y.money+=5;A.money+=5;render();msg('Sandwiches done! +$5 each for drink, dessert & side');await sleep(1900)}
showCard(it);setTurn('');await sleep(1000);
if(full(Y,it.cat)){await give(it,'ai',0);continue}if(full(A,it.cat)){await give(it,'you',0);continue}
if(!Y.money||!A.money){if(!Y.money&&!A.money){await give(it,all(Y).length<=all(A).length?'you':'ai',0);continue}
const rich=Y.money?'you':'ai';msg(`${G[rich=='you'?'ai':'you'].n} is out of cash!`);let take;
if(rich=='you'){msg('Do you wanna take it?');take=await ask(()=>[{l:'Yes',f:()=>take_(true)},{l:'No',c:'r',f:()=>take_(false)}],false)}
else{await sleep(1300);take=gain(A,it)>1&&!(gain(G.you,it)<=-3&&gain(A,it)<6)}
await give(it,take?rich:rich=='you'?'ai':'you',0);continue}
let price=0,last=null,turn=k++%2?'ai':'you';
for(;;){const me=G[turn],o=turn=='you'?'ai':'you';setTurn(turn);let act;
if(price>0&&me.money<=price){msg(`${me.n} can't afford more`);await sleep(900);act={t:'l'}}
else if(turn=='you'){const m=me.money,four=all(me).length==CAP-1;
act=await ask((draw,fin)=>four?[{l:'All In',c:'r',d:m<=price,f:()=>fin({t:'b',a:m})},{l:'Leave It',f:()=>fin({t:'l'})}]:[{l:'Offer +1',d:m<=price,f:()=>fin({t:'b',a:price+1})},{l:'Offer…',d:m<=price,f:()=>step(price+1,m,fin)},{l:'Leave',c:'r',d:price==0,f:()=>fin({t:'l'})}],four?{t:'l'}:price==0?{t:'b',a:1}:{t:'l'})}
else act=await aiAct(price,it);
if(act.t=='l'){await give(it,o,price);break}
price=act.a;last=turn;turn=o;setPrice(price);msg(`${me.n} offers $${price}${price==me.money?' — ALL IN!':''}`);await sleep(500)}}
await finish()}
let take_=()=>{};
// the Yes/No buttons need access to ask()'s resolver
const _ask=ask;ask=function(mk,def,ms){return _ask((d,f)=>{take_=f;return mk(d,f)},def,ms)};
async function finish(){setTurn('');$('#turn').textContent=mode=='complete'?'Plate complete!':'Sandwiches done!';msg(mode=='complete'?'The judge is tasting the plate…':'The judge is tasting…');document.querySelectorAll('#game svg.sw').forEach(s=>s.classList.add('closed'));await sleep(2200);
const R=['you','ai'].map(w=>{const P=G[w],S=score(all(P)),b=0;return{P,S,t:S.s+b}});
const[y,a]=R,win=y.t==a.t?null:y.t>a.t?y:a;
const best=(win||y).S.notes.slice().sort((p,q)=>q[1]-p[1])[0],worst=(win?R.find(r=>r!=win):a).S.notes.slice().sort((p,q)=>p[1]-q[1])[0];
const card=r=>`<div class='res${r==win?' w':''}'><b>${r.P.n}</b><div class='swh'></div><div class='sc'>${r.t}</div><ul>${r.S.notes.slice().sort((p,q)=>Math.abs(q[1])-Math.abs(p[1])).slice(0,4).map(n=>`<li><span>${n[0]}</span><i>${n[1]>0?'+':''}${n[1]}</i></li>`).join('')}</ul></div>`;
$('#end').innerHTML=`<h1 class='t'>${win?win.P.n+' wins!':'A tie!'}</h1><div style='display:flex;gap:8px'>${card(y)}${card(a)}</div><p style='text-align:center;margin:6px 8px'>${win?`${best&&best[1]>0?`“${best[0]}” made the difference.`:'Strong all around.'}${worst&&worst[1]<0?` ${worst[0]} hurt the other side.`:''}`:'Same flavor, same score.'}</p><button class='b r big' style='margin:0 auto 12px' onclick='location.reload()'>Play again</button>`;
const sws=document.querySelectorAll('#end .swh');fill(sws[0],y.P.items);fill(sws[1],a.P.items);[y,a].forEach((r,i)=>r.P.x.forEach(x=>putSlot(sws[i],x)));sws.forEach(e=>e.classList.toggle('pl',mode=='complete'));sws.forEach(s=>s.firstChild.classList.add('closed'));show('end')}
</script></body></html>
